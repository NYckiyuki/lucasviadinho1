<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Interdisciplinar Avançado: Óptica, Programação e Robótica Assistiva</title>
    <style>
        /* --- PADRONIZAÇÃO DE DESIGN SISTÊMICO E ACESSIBILIDADE DE CORES --- */
        :root {
            --bg-principal: #f8fafc;
            --bg-card: #ffffff;
            --texto-principal: #1e293b;
            --texto-secundario: #475569;
            --cor-acentuacao: #0f172a;
            --cor-link: #0284c7;
            --cor-borda: #cbd5e1;
            --cor-destaque: #e2e8f0;
            --cor-alerta: #b91c1c;
            --cor-sucesso: #16a34a;
            --cor-aviso: #ca8a04;
        }

        /* Sobrescrita de Variáveis para o Modo de Alto Contraste (Baixa Visão) */
        .alto-contraste {
            --bg-principal: #000000;
            --bg-card: #121212;
            --texto-principal: #ffffff;
            --texto-secundario: #e2e8f0;
            --cor-acentuacao: #ffff00;
            --cor-link: #ffff00;
            --cor-borda: #ffffff;
            --cor-destaque: #1e1e1e;
            --cor-alerta: #ffff00;
            --cor-sucesso: #ffff00;
            --cor-aviso: #ffff00;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            margin: 0;
            padding: 0;
            line-height: 2.0;
            font-size: 1.3rem; /* Fonte ampliada nativa para garantir a inclusão social */
            transition: background 0.2s, color 0.2s;
        }

        /* Link invisível para usuários de navegação por teclado e leitores de tela */
        .skip-link {
            position: absolute;
            top: -150px;
            left: 15px;
            background: var(--cor-acentuacao);
            color: var(--bg-card);
            padding: 20px;
            z-index: 2000;
            text-decoration: none;
            border: 3px solid var(--texto-principal);
            font-weight: bold;
            border-radius: 8px;
        }
        .skip-link:focus {
            top: 15px;
        }

        /* Painel Assistivo Superior Fixo */
        .barra-acessibilidade {
            background-color: var(--bg-card);
            border-bottom: 4px solid var(--cor-borda);
            padding: 15px 35px;
            position: sticky;
            top: 0;
            z-index: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .titulo-barra {
            font-size: 1.05rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--texto-secundario);
        }

        .grupo-botoes {
            display: flex;
            gap: 15px;
        }

        .btn-assistivo {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            border: 2px solid var(--texto-principal);
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .btn-assistivo:hover, .btn-assistivo:focus {
            background-color: var(--texto-principal);
            color: var(--bg-card);
            outline: 4px solid #f59e0b;
        }

        /* Estrutura de Layout e Blocos Organizacionais */
        header {
            max-width: 1200px;
            margin: 60px auto 40px auto;
            padding: 0 30px;
            text-align: center;
        }

        header h1 {
            font-size: 3.2rem;
            color: var(--cor-acentuacao);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .meta-info {
            font-size: 1.3rem;
            color: var(--texto-secundario);
            border-bottom: 3px solid var(--cor-borda);
            padding-bottom: 30px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        section {
            background-color: var(--bg-card);
            padding: 60px;
            margin-bottom: 60px;
            border-radius: 20px;
            border: 1px solid var(--cor-borda);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.02);
        }

        h2 {
            font-size: 2.2rem;
            color: var(--cor-acentuacao);
            border-left: 10px solid var(--cor-acentuacao);
            padding-left: 24px;
            margin-top: 0;
            margin-bottom: 35px;
        }

        h3 {
            font-size: 1.75rem;
            color: var(--cor-acentuacao);
            margin-top: 50px;
            border-bottom: 3px solid var(--cor-destaque);
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        h4 {
            font-size: 1.45rem;
            color: var(--cor-acentuacao);
            margin-top: 30px;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 30px;
            text-align: justify;
        }

        ul, ol {
            margin-bottom: 30px;
            padding-left: 40px;
        }

        li {
            margin-bottom: 16px;
        }

        /* Containers Especiais para Gráficos Técnicos e Fotos SVG */
        .container-visual {
            background-color: var(--bg-principal);
            border: 2px solid var(--cor-borda);
            border-radius: 16px;
            padding: 40px;
            margin: 45px 0;
            text-align: center;
            box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.02);
        }

        .legenda-visual {
            font-size: 1.05rem;
            color: var(--texto-secundario);
            margin-top: 20px;
            font-style: italic;
            font-weight: bold;
        }

        /* Sistema de Malha Adaptativa (Grid) */
        .grid-duplo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 40px;
        }

        @media (max-width: 900px) {
            .grid-duplo {
                grid-template-columns: 1fr;
            }
        }

        .card-conteudo {
            background-color: var(--bg-principal);
            border: 1px solid var(--cor-borda);
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.01);
        }

        .card-conteudo h4 {
            margin-top: 0;
            font-size: 1.55rem;
            color: var(--cor-acentuacao);
            border-bottom: 2px solid var(--cor-borda);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        /* Bloco de Transcrição Textual Simulado de Áudio */
        .bloco-transcricao {
            background-color: var(--cor-destaque);
            border-left: 10px solid var(--texto-principal);
            padding: 40px;
            margin: 45px 0;
            border-radius: 0 16px 16px 0;
        }

        .player-simulado {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .icone-play {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid var(--texto-principal);
        }

        /* Bloco Institucional e Telefone de Atendimento */
        .secao-consulta {
            background-color: var(--cor-destaque);
            border: 4px dashed var(--cor-alerta);
            text-align: center;
            padding: 60px;
            border-radius: 24px;
            margin-top: 60px;
        }

        .numero-telefone {
            font-size: 3.2rem;
            font-weight: bold;
            color: var(--cor-alerta);
            margin: 30px 0;
            display: inline-block;
            letter-spacing: 3px;
            border: 3px solid var(--cor-alerta);
            padding: 15px 40px;
            border-radius: 12px;
            background-color: var(--bg-card);
        }

        footer {
            text-align: center;
            padding: 60px 30px;
            background-color: var(--bg-card);
            border-top: 3px solid var(--cor-borda);
            color: var(--texto-secundario);
            margin-top: 100px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- Link técnico de acessibilidade estrutural para leitores de tela -->
    <a href="#conteudo-principal-artigo" class="skip-link">Pular diretamente para o conteúdo principal da pesquisa</a>

    <!-- Painel Dinâmico de Acessibilidade -->
    <div class="barra-acessibilidade" role="toolbar" aria-label="Painel Assistivo do Usuário">
        <span class="titulo-barra">Recursos Assistivos Digitais (Baixa Visão):</span>
        <div class="grupo-botoes">
            <button class="btn-assistivo" onclick="alterarTamanhoFonte(1.15)" aria-label="Aumentar Fonte Textual">A+</button>
            <button class="btn-assistivo" onclick="alterarTamanhoFonte(0.85)" aria-label="Diminuir Fonte Textual">A-</button>
            <button class="btn-assistivo" onclick="alternarContrasteGlobal()" aria-label="Inverter Cores da Interface para Alto Contraste">Alto Contraste</button>
        </div>
    </div>

    <header>
        <h1>A Convergência Interdisciplinar da Óptica e Automação na Acessibilidade Visual</h1>
        <p class="meta-info">Artigo de Pesquisa Acadêmica Estruturado — Física e Tecnociência, Programação Lógica e Robótica</p>
    </header>

    <main id="conteudo-princProjeto Acadêmico Interdisciplinar | Desenvolvido em Rigorosa Conformidade com as Normas Regulatórias ABNT e Práticas de Acessibilidade Digital de Alta Performance// Inicialização do multiplicador de escala escalar para gerenciamento tipográficolet multiplicadorFonteBase = 1.0;/*** Altera o tamanho tipográfico de forma proporcional em toda a árvore do documento HTML.* Garante que o layout não quebre ao aplicar margens de segurança na escala.* @param {number} fatorAlteracao - O coeficiente de ajuste da fonte (ex: 1.15 para aumentar, 0.85 para diminuir).*/function alterarTamanhoFonte(fatorAlteracao) {// Aplica a operação aritmética de multiplicação escalarmultiplicadorFonteBase *= fatorAlteracao;// Definição de limites de segurança (Constraints) para o viewportif (multiplicadorFonteBase > 2.2) {multiplicadorFonteBase = 2.2;}if (multiplicadorFonteBase < 0.85) {multiplicadorFonteBase = 0.85;}// Injeção direta da propriedade de estilo CSS no elemento root bodydocument.body.style.fontSize = multiplicadorFonteBase + "em";}/*** Alterna o estado de classe do elemento body para gerenciamento de alto contraste.* Altera em tempo real o valor das variáveis CSS (:root) para paletas otimizadas para baixa visão.*/function alternarContrasteGlobal() {// Executa a inversão binária (toggle) da classe assistiva de alto contrastedocument.body.classList.toggle("alto-contraste");}
